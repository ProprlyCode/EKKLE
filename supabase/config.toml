# Supabase local config. `supabase start` uses this; `supabase db reset` applies
# migrations in supabase/migrations then runs supabase/seed.sql.
project_id = "ekkle"

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
# The pilot data plus Study 1, so CI and local stacks have a real study to open.
sql_paths = ["./seed.sql", "./seed_study_01.sql"]

[api]
enabled = true
port = 54321
schemas = ["public"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Real site URL comes from env in deployed environments.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/**"]
