# Supabase local config. `supabase start` uses this; `supabase db reset` applies
# migrations in supabase/migrations then runs supabase/seed.sql.
project_id = "ekkle"

[db]
port = 54322
major_version = 17

[api]
enabled = true
port = 54321
schemas = ["public"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Real site URL comes from env in deployed environments.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
