# Weekly dependency updates, opened as pull requests. Each PR runs the full CI
# (app checks, database + security tests, end-to-end) but never deploys —
# deploys only happen from main. Minor and patch bumps are grouped into one PR
# per ecosystem to keep the noise down; major versions come one at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # 0.5 requires ESLint 9+; the project is on ESLint 8. Revisit with the
      # ESLint 9 upgrade.
      - dependency-name: eslint-plugin-react-refresh
        versions: [">=0.5.0"]
      # Tailwind 4 is a config migration (CSS-first config, @tailwindcss/postcss),
      # to be done as its own planned change.
      - dependency-name: tailwindcss
        versions: [">=4.0.0"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch, major]
