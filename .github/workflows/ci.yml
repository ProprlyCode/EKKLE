# CI + database deploys.
#
# Every push and pull request:
#   app       — typecheck, lint, unit tests, production build
#   database  — boots a fresh local Supabase (Postgres 17) and applies every
#               migration in supabase/migrations plus supabase/seed.sql, then
#               lints the SQL. A migration that won't apply cleanly fails here,
#               before it can reach the live database.
#
# Pushes to main only, once both pass:
#   deploy-db — `supabase db push` applies any new migrations to the live
#               project. Migrations only reach Supabase through this job.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a Supabase personal access token
#   SUPABASE_DB_PASSWORD   — the project's database password

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_PROJECT_ID: ptsmkxyubvzhyklnbyjt

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  database:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a fresh database (applies migrations + seed)
        run: supabase db start
      - name: Lint SQL
        run: supabase db lint --level error --fail-on error
      - name: Stop
        if: always()
        run: supabase stop --no-backup

  deploy-db:
    name: Deploy migrations to Supabase
    needs: [app, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-db
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Pending migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
