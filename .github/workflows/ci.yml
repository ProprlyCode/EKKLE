# CI + database deploys.
#
# Every push and pull request:
#   app       — typecheck, lint, unit tests, production build
#   e2e       — (advisory for now) boots the full local Supabase stack and
#               drives the real app in a browser with Playwright: waitlist,
#               recipient → member → reply, seeker sign-up → first study.
#   database  — boots a fresh local Supabase (Postgres 17) and applies every
#               migration in supabase/migrations plus supabase/seed.sql, lints
#               the SQL, then runs the access-rule tests in supabase/tests. A
#               migration that won't apply, or that breaks a safeguarding rule,
#               fails here before it can reach the live database.
#
# Pushes to main only, once both pass:
#   deploy-db   — `supabase db push` applies any new migrations to the live
#                 project. Migrations only reach Supabase through this job.
#   deploy-site — then builds and deploys the site to Vercel production, so the
#                 site never goes live ahead of the database it needs. (Vercel's
#                 own auto-deploy for main is off in vercel.json.)
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a Supabase personal access token
#   SUPABASE_DB_PASSWORD   — the project's database password
#   VERCEL_TOKEN           — a Vercel access token scoped to the Ekkle team

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_PROJECT_ID: ptsmkxyubvzhyklnbyjt
  VERCEL_ORG_ID: team_CqyQAUrH4y8OvjphD6yDv7fM
  VERCEL_PROJECT_ID: prj_KmjggvYfbzlOb4zJn8UzEyN8DRgy

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  database:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a fresh database (applies migrations + seed)
        run: supabase db start
      - name: Lint SQL
        run: supabase db lint --level error --fail-on error
      - name: Database security tests
        run: supabase test db
      - name: Stop
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: End-to-end (advisory)
    runs-on: ubuntu-latest
    # Advisory while the suite settles in: a failure is reported but doesn't
    # block deploys. Flip to required (drop this and add to deploy-db's needs)
    # once it has run clean for a while.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (db, auth, API, mail catcher)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Export local Supabase settings
        run: |
          supabase status -o env \
            | sed -E 's/^([A-Z_]+)="?([^"]*)"?$/SB_\1=\2/' >> "$GITHUB_ENV"
      - name: Build against the local stack
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ env.SB_API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SB_ANON_KEY }}
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npx playwright test
        env:
          SUPABASE_URL: ${{ env.SB_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SERVICE_ROLE_KEY }}
          MAILPIT_URL: ${{ env.SB_MAILPIT_URL || env.SB_INBUCKET_URL }}
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Stop
        if: always()
        run: supabase stop --no-backup

  deploy-db:
    name: Deploy migrations to Supabase
    needs: [app, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-db
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Pending migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

  deploy-site:
    name: Deploy site to Vercel
    needs: [deploy-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret is set
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add VERCEL_TOKEN in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show what the token can reach
        run: |
          npx vercel@latest whoami --token="$VERCEL_TOKEN"
          npx vercel@latest teams ls --token="$VERCEL_TOKEN" || true
          npx vercel@latest project ls --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN" || true
      - name: Pull production settings and env
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to production
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
