# CI + database deploys.
#
# Every push and pull request:
#   app       — typecheck, lint, unit tests, production build
#   e2e       — boots the full local Supabase stack and
#               drives the real app in a browser with Playwright: waitlist,
#               recipient → member → reply, seeker sign-up → first study.
#   database  — boots a fresh local Supabase (Postgres 17) and applies every
#               migration in supabase/migrations plus supabase/seed.sql, lints
#               the SQL, then runs the access-rule tests in supabase/tests. A
#               migration that won't apply, or that breaks a safeguarding rule,
#               fails here before it can reach the live database.
#
# Pushes to main only, once all three pass:
#   staging     — deploys the same commit to the staging database (migrations
#                 + demo seed + demo logins) and staging.ekkle.org, then runs
#                 the smoke tests in e2e-staging/ there. Production waits on it.
#   deploy-db   — `supabase db push` applies any new migrations to the live
#                 project. Migrations only reach Supabase through this job.
#   deploy-site — then asks Vercel (REST API) to deploy exactly the commit CI
#                 tested and waits until it is live, so the site never goes live
#                 ahead of the database it needs. (Vercel's own auto-deploy for
#                 main is off in vercel.json.)
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a Supabase personal access token
#   SUPABASE_DB_PASSWORD   — the project's database password
#   VERCEL_TOKEN           — a Vercel token for the Ekkle team (creates and
#                            watches the production deployment)
#   STAGING_DB_PASSWORD    — the ekkle-staging project's database password
#   STAGING_DEMO_PASSWORD  — password for the demo logins on staging
#   RESEND_API_KEY         — optional; turns on email (notifications + sign-in
#                            email through Resend) — see the deploy-db job

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_PROJECT_ID: ptsmkxyubvzhyklnbyjt
  VERCEL_ORG_ID: team_CqyQAUrH4y8OvjphD6yDv7fM
  VERCEL_PROJECT_ID: prj_KmjggvYfbzlOb4zJn8UzEyN8DRgy

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx vite build

  database:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # pinned: "latest" needs a rate-limited GitHub API lookup
      - name: Start a fresh database (applies migrations + seed)
        run: supabase db start
      - name: Lint SQL
        run: supabase db lint --level error --fail-on error
      - name: Database security tests
        run: supabase test db
      - name: Stop
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # pinned: "latest" needs a rate-limited GitHub API lookup
      - name: Start local Supabase (db, auth, API, mail catcher)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Export local Supabase settings
        run: |
          supabase status -o env \
            | sed -E 's/^([A-Z_]+)="?([^"]*)"?$/SB_\1=\2/' >> "$GITHUB_ENV"
      - name: Build against the local stack
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ env.SB_API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SB_ANON_KEY }}
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npx playwright test
        env:
          SUPABASE_URL: ${{ env.SB_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SERVICE_ROLE_KEY }}
          MAILPIT_URL: ${{ env.SB_MAILPIT_URL || env.SB_INBUCKET_URL }}
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Stop
        if: always()
        run: supabase stop --no-backup

  # Staging: the same commit, deployed to a separate demo database and site
  # (staging.ekkle.org), then smoke-tested there as real personas. Production
  # only deploys once this passes. Skipped (with a notice) until the staging
  # secrets exist.
  staging:
    name: Deploy + test staging
    needs: [app, database, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      DEMO_PASSWORD: ${{ secrets.STAGING_DEMO_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      STAGING_REF: twxosrcbxidqmbjlzkga
      STAGING_HOST: staging.ekkle.org
    steps:
      - name: Check staging secrets
        id: gate
        run: |
          if [ -z "$STAGING_DB_PASSWORD" ] || [ -z "$DEMO_PASSWORD" ]; then
            echo "::notice::Staging is off: add STAGING_DB_PASSWORD and STAGING_DEMO_PASSWORD to turn it on."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.on == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.on == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.on == 'true'
        run: npm ci
      - if: steps.gate.outputs.on == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Staging database — migrations + demo seed
        if: steps.gate.outputs.on == 'true'
        run: |
          supabase link --project-ref "$STAGING_REF" --password "$STAGING_DB_PASSWORD"
          supabase db push --include-seed --password "$STAGING_DB_PASSWORD"
      - name: Staging auth settings + demo personas
        if: steps.gate.outputs.on == 'true'
        run: |
          jq -n --arg host "$STAGING_HOST" --rawfile tpl supabase/templates/sign_in.html '{
            site_url: ("https://" + $host),
            uri_allow_list: ("https://" + $host + "/**"),
            mailer_otp_length: 6,
            mailer_subjects_magic_link: "Your Ekklē sign-in (staging)",
            mailer_templates_magic_link_content: $tpl,
            mailer_subjects_confirmation: "Your Ekklē sign-in (staging)",
            mailer_templates_confirmation_content: $tpl
          }' > /tmp/auth.json
          code=$(curl -sS -o /tmp/auth-out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$STAGING_REF/config/auth" -d @/tmp/auth.json)
          if [ "$code" -ge 300 ]; then
            echo "::error::Supabase refused the staging auth settings (HTTP $code): $(head -c 400 /tmp/auth-out.json)"
            exit 1
          fi
          KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$STAGING_REF/api-keys?reveal=true" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$KEY"
          SUPABASE_URL="https://$STAGING_REF.supabase.co" SUPABASE_SERVICE_ROLE_KEY="$KEY" \
            node scripts/staging/personas.mjs
      # A preview deploy of this commit: Vercel's Preview environment variables
      # point it at the staging database. Then staging.ekkle.org → it.
      - name: Staging site
        if: steps.gate.outputs.on == 'true'
        run: |
          body=$(jq -n --arg p "$VERCEL_PROJECT_ID" --arg sha "$GITHUB_SHA" \
            --arg org "${GITHUB_REPOSITORY%%/*}" --arg repo "${GITHUB_REPOSITORY##*/}" \
            '{name: "ekkle", project: $p,
              gitSource: {type: "github", org: $org, repo: $repo, ref: "main", sha: $sha}}')
          code=$(curl -sS -o /tmp/dep.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID" -d "$body")
          if [ "$code" -ge 300 ]; then
            echo "::error::Vercel refused the staging deploy (HTTP $code): $(jq -c '.error' /tmp/dep.json)"
            exit 1
          fi
          id=$(jq -r .id /tmp/dep.json)
          if [ "$(jq -r '.target // "preview"' /tmp/dep.json)" = "production" ]; then
            curl -sS -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v12/deployments/$id/cancel?teamId=$VERCEL_ORG_ID" > /dev/null
            echo "::error::Vercel made the staging deploy a production one; cancelled it."
            exit 1
          fi
          for i in $(seq 1 90); do
            state=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$id?teamId=$VERCEL_ORG_ID" | jq -r '.readyState')
            echo "[$i] $state"
            case "$state" in
              READY) break ;;
              ERROR|CANCELED) echo "::error::Staging deploy $state."; exit 1 ;;
            esac
            [ "$i" = 90 ] && { echo "::error::Timed out waiting for the staging deploy."; exit 1; }
            sleep 10
          done
          code=$(curl -sS -o /tmp/alias.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" \
            -d "{\"alias\":\"$STAGING_HOST\"}")
          if [ "$code" -ge 300 ]; then
            echo "::error::Could not point $STAGING_HOST at the deploy (HTTP $code): $(head -c 400 /tmp/alias.json)"
            exit 1
          fi
          echo "https://$STAGING_HOST now serves ${GITHUB_SHA:0:7}"
      - name: Install browser
        if: steps.gate.outputs.on == 'true'
        run: npx playwright install --with-deps chromium
      - name: Smoke tests on staging
        if: steps.gate.outputs.on == 'true'
        run: npx playwright test -c playwright.staging.config.ts
        env:
          STAGING_URL: https://${{ env.STAGING_HOST }}
      - name: Keep the report
        if: failure() && steps.gate.outputs.on == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staging-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy-db:
    name: Deploy migrations to Supabase
    needs: [app, database, e2e, staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-db
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0 # pinned: "latest" needs a rate-limited GitHub API lookup
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Pending migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      # Email: off until the RESEND_API_KEY secret exists. Then, on every deploy:
      # functions + their secrets, the trigger's config row, and Supabase Auth
      # sending through Resend with the link + 6-digit-code template.
      - name: Email notifications and sign-in email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::notice::RESEND_API_KEY is not set, so email stays off. Add it to turn notifications on."
            exit 0
          fi
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          DB="host=aws-0-us-west-2.pooler.supabase.com port=5432 dbname=postgres user=postgres.$SUPABASE_PROJECT_ID sslmode=require"

          # One shared secret between the trigger and the functions; reuse it.
          SECRET=$(psql "$DB" -tAc "select secret from private.notify_config limit 1")
          [ -n "$SECRET" ] || SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$SECRET"

          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            RESEND_API_KEY="$RESEND_API_KEY" NOTIFY_FROM="Ekklē <hello@ekkle.org>" \
            SITE_URL="https://ekkle.org" NOTIFY_SECRET="$SECRET"
          supabase functions deploy notify notify-report \
            --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

          psql "$DB" -v ON_ERROR_STOP=1 -c "insert into private.notify_config (id, base_url, secret)
            values (true, 'https://$SUPABASE_PROJECT_ID.supabase.co', '$SECRET')
            on conflict (id) do update set base_url = excluded.base_url, secret = excluded.secret"

          jq -n --arg key "$RESEND_API_KEY" --rawfile tpl supabase/templates/sign_in.html '{
            smtp_host: "smtp.resend.com", smtp_port: "465", smtp_user: "resend",
            smtp_pass: $key, smtp_admin_email: "hello@ekkle.org", smtp_sender_name: "Ekklē",
            mailer_otp_length: 6, rate_limit_email_sent: 100,
            mailer_subjects_magic_link: "Your Ekklē sign-in",
            mailer_templates_magic_link_content: $tpl,
            mailer_subjects_confirmation: "Your Ekklē sign-in",
            mailer_templates_confirmation_content: $tpl
          }' > /tmp/auth.json
          code=$(curl -sS -o /tmp/auth-out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" -d @/tmp/auth.json)
          if [ "$code" -ge 300 ]; then
            echo "::error::Supabase refused the auth email settings (HTTP $code): $(head -c 400 /tmp/auth-out.json)"
            exit 1
          fi
          echo "Email is on: notifications deployed, sign-in email sends through Resend."

  deploy-site:
    name: Deploy site to Vercel
    needs: [deploy-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check secret is set
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add VERCEL_TOKEN in Settings → Secrets and variables → Actions."
            exit 1
          fi
      # Ask Vercel to build exactly the commit CI just tested, with the
      # project's own build settings and environment variables.
      - name: Start the production deploy of this commit
        run: |
          body=$(jq -n --arg p "$VERCEL_PROJECT_ID" --arg sha "$GITHUB_SHA" \
            --arg org "${GITHUB_REPOSITORY%%/*}" --arg repo "${GITHUB_REPOSITORY##*/}" \
            '{name: "ekkle", project: $p, target: "production",
              gitSource: {type: "github", org: $org, repo: $repo, ref: "main", sha: $sha}}')
          code=$(curl -sS -o /tmp/dep.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID" -d "$body")
          if [ "$code" -ge 300 ]; then
            echo "::error::Vercel refused the deploy (HTTP $code): $(jq -c '.error' /tmp/dep.json)"
            exit 1
          fi
          echo "DEPLOY_ID=$(jq -r .id /tmp/dep.json)" >> "$GITHUB_ENV"
          echo "Started $(jq -r .url /tmp/dep.json) for ${GITHUB_SHA:0:7}"
      - name: Wait for it to go live
        run: |
          for i in $(seq 1 90); do
            state=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOY_ID?teamId=$VERCEL_ORG_ID" | jq -r '.readyState')
            echo "[$i] $state"
            case "$state" in
              READY) echo "Live."; exit 0 ;;
              ERROR|CANCELED) echo "::error::Vercel deploy $state — see the ekkle project's Deployments page."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for the Vercel deploy."; exit 1

  # One open issue while main is red, assigned to the repo owner (GitHub emails
  # it); a comment on each further failure; closed automatically once green.
  alert:
    name: Alert when main is red
    needs: [app, database, e2e, staging, deploy-db, deploy-site]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI is failing on main"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          short="${GITHUB_SHA:0:7}"
          if [ "$FAILED" = "true" ]; then
            body="Commit \`$short\` by @$GITHUB_ACTOR failed CI — the run shows which step and what (if anything) was deployed. Run: $RUN_URL"
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "Green again at \`$short\` and deployed. $RUN_URL"
          fi
